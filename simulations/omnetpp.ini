[General]
network = simulations.CampusNetwork
sim-time-limit = 180s
record-eventlog = false
**.cmdenv-log-level = info

# Enable result recording
**.scalar-recording = true
**.vector-recording = true

# ── IP Auto-configuration ─────────────────────────────────────────────
# Let INET auto-assign all IPs — simplest and most reliable approach
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = true
*.configurator.addSubnetRoutes = true

# ─────────────────────────────────────────────────────────────────────
# Config 1: Static Routing
# ─────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────
# Config 1: Static Routing
# ─────────────────────────────────────────────────────────────────────
[Config StaticRouting]
description = "Campus network with Static Routing + Failure Scenario"

# ── Traffic Generator: SE hosts send UDP to App Server ────────────────
*.seHost*.numApps = 1
*.seHost*.app[0].typename = "UdpBasicApp"
*.seHost*.app[0].destAddresses = "10.0.6.1"
*.seHost*.app[0].destPort = 5000
*.seHost*.app[0].messageLength = 512B
*.seHost*.app[0].sendInterval = 10ms
*.seHost*.app[0].startTime = 20s
*.seHost*.app[0].stopTime = 155s

# ── App Server listens for incoming UDP traffic ───────────────────────
*.appServer.numApps = 1
*.appServer.app[0].typename = "UdpSink"
*.appServer.app[0].localPort = 5000

# ── Static routing via auto-configurator ─────────────────────────────
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = true
*.configurator.addSubnetRoutes = true

# ── Failure Scenario Script ───────────────────────────────────────────
# ScenarioManager loads the XML script that controls link failure/recovery
*.scenarioManager.script = xmldoc("failure_scenario.xml")

# ─────────────────────────────────────────────────────────────────────
# Config 2: RIP  (Member 2 fills this)
# ─────────────────────────────────────────────────────────────────────
[Config RIP]
description = "Campus network with RIP"

# ─────────────────────────────────────────────────────────────────────
# Config 3: OSPF  (Member 3 fills this)
# ─────────────────────────────────────────────────────────────────────
[Config OSPF]
description = "Campus network with OSPF"