[General]
network = simulations.CampusNetwork
sim-time-limit = 180s
record-eventlog = false
**.cmdenv-log-level = info

# Enable result recording
**.scalar-recording = true
**.vector-recording = true

# ── IP Auto-configuration ─────────────────────────────────────────────
# Let INET auto-assign all IPs — simplest and most reliable approach
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = true
*.configurator.addSubnetRoutes = true

# ─────────────────────────────────────────────────────────────────────
# Config 1: Static Routing
# ─────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────
# Config 1: Static Routing
# ─────────────────────────────────────────────────────────────────────
[Config StaticRouting]
description = "Campus network with Static Routing + Failure Scenario"

# ── Traffic Generator: SE hosts send UDP to App Server ────────────────
*.seHost*.numApps = 1
*.seHost*.app[0].typename = "UdpBasicApp"
*.seHost*.app[0].destAddresses = "10.0.6.1"
*.seHost*.app[0].destPort = 5000
*.seHost*.app[0].messageLength = 512B
*.seHost*.app[0].sendInterval = 10ms
*.seHost*.app[0].startTime = 20s
*.seHost*.app[0].stopTime = 155s

# ── App Server listens for incoming UDP traffic ───────────────────────
*.appServer.numApps = 1
*.appServer.app[0].typename = "UdpSink"
*.appServer.app[0].localPort = 5000

# ── Static routing via auto-configurator ─────────────────────────────
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = true
*.configurator.addSubnetRoutes = true

# ── Failure Scenario Script ───────────────────────────────────────────
# ScenarioManager loads the XML script that controls link failure/recovery
*.scenarioManager.script = xmldoc("failure_scenario.xml")

# ─────────────────────────────────────────────────────────────────────
# Config 2: RIP  (Member 2 fills this)
# ─────────────────────────────────────────────────────────────────────
[Config RIP]
description = "Campus network with RIP routing"

*.seHost1.numApps = 1
*.seHost1.app[0].typename = "UdpBasicApp"
*.seHost1.app[0].destAddresses = "appServer"
*.seHost1.app[0].destPort = 5000
*.seHost1.app[0].messageLength = 512B
*.seHost1.app[0].sendInterval = 10ms
*.seHost1.app[0].startTime = 20s
*.seHost1.app[0].stopTime = 155s

*.seHost2.numApps = 1
*.seHost2.app[0].typename = "UdpBasicApp"
*.seHost2.app[0].destAddresses = "appServer"
*.seHost2.app[0].destPort = 5000
*.seHost2.app[0].messageLength = 512B
*.seHost2.app[0].sendInterval = 10ms
*.seHost2.app[0].startTime = 20s
*.seHost2.app[0].stopTime = 155s

*.seHost3.numApps = 1
*.seHost3.app[0].typename = "UdpBasicApp"
*.seHost3.app[0].destAddresses = "appServer"
*.seHost3.app[0].destPort = 5000
*.seHost3.app[0].messageLength = 512B
*.seHost3.app[0].sendInterval = 10ms
*.seHost3.app[0].startTime = 20s
*.seHost3.app[0].stopTime = 155s

*.appServer.numApps = 1
*.appServer.app[0].typename = "UdpSink"
*.appServer.app[0].localPort = 5000

# Enable RIP on all 5 routers
*.coreRouter.hasRip = true
*.seRouter.hasRip = true
*.eeRouter.hasRip = true
*.bbaRouter.hasRip = true
*.adminRouter.hasRip = true

# updateInterval: routers broadcast full routing table every 30s (standard RFC value)
**.rip.updateInterval = 30s

# routeExpiryTime: route marked invalid if no update received in 180s
**.rip.routeExpiryTime = 180s

# routePurgeTime: invalid route deleted after additional 120s
**.rip.routePurgeTime = 120s

# splitHorizon: prevents routing loops by not advertising routes back on learned interface
**.rip.splitHorizonMode = "splitHorizon"

*.scenarioManager.script = xmldoc("failure_scenario.xml")

output-scalar-file = results/RIP-${configname}.sca
output-vector-file = results/RIP-${configname}.vec

# ─────────────────────────────────────────────────────────────────────
# Config 3: OSPF
# ─────────────────────────────────────────────────────────────────────
[Config OSPF]
description = "Campus network with OSPF (Link-State routing)"

# ── Enable OSPF, disable RIP on all routers ───────────────────────────
# hasOspf activates the Ospfv2 submodule built into INET's Router type.
# hasRip is set false so both protocols don't run simultaneously.
*.coreRouter.hasOspf  = true
*.seRouter.hasOspf    = true
*.eeRouter.hasOspf    = true
*.bbaRouter.hasOspf   = true
*.adminRouter.hasOspf = true

*.coreRouter.hasRip  = false
*.seRouter.hasRip    = false
*.eeRouter.hasRip    = false
*.bbaRouter.hasRip   = false
*.adminRouter.hasRip = false

# ── Single OSPF config file for all routers ───────────────────────────
# INET 4.5 reads one shared ASConfig.xml that defines ALL routers and
# ALL interfaces. Each <Router name="..."> block inside it must match
# the OMNeT++ module name exactly (coreRouter, seRouter, etc.)
*.coreRouter.ospf.ospfConfig  = xmldoc("ospf-config/ASConfig.xml")
*.seRouter.ospf.ospfConfig    = xmldoc("ospf-config/ASConfig.xml")
*.eeRouter.ospf.ospfConfig    = xmldoc("ospf-config/ASConfig.xml")
*.bbaRouter.ospf.ospfConfig   = xmldoc("ospf-config/ASConfig.xml")
*.adminRouter.ospf.ospfConfig = xmldoc("ospf-config/ASConfig.xml")

# ── Traffic: identical to StaticRouting for fair comparison ───────────
*.seHost*.numApps = 1
*.seHost*.app[0].typename      = "UdpBasicApp"
*.seHost*.app[0].destAddresses = "10.0.6.1"
*.seHost*.app[0].destPort      = 5000
*.seHost*.app[0].messageLength = 512B
*.seHost*.app[0].sendInterval  = 10ms
*.seHost*.app[0].startTime     = 20s
*.seHost*.app[0].stopTime      = 155s

*.appServer.numApps = 1
*.appServer.app[0].typename  = "UdpSink"
*.appServer.app[0].localPort = 5000

# ── Failure scenario ──────────────────────────────────────────────────
# SE-Core link goes down at t=60s, restored at t=120s.
# OSPF detects failure once Dead interval (40s) expires with no Hello,
# then floods updated LSAs — reconverges far faster than RIP.
*.scenarioManager.script = xmldoc("failure_scenario.xml")

# ── Result recording for OSPF modules ────────────────────────────────
*.coreRouter.ospf.**.scalar-recording  = true
*.coreRouter.ospf.**.vector-recording  = true
*.seRouter.ospf.**.scalar-recording    = true
*.seRouter.ospf.**.vector-recording    = true
*.eeRouter.ospf.**.scalar-recording    = true
*.eeRouter.ospf.**.vector-recording    = true
*.bbaRouter.ospf.**.scalar-recording   = true
*.bbaRouter.ospf.**.vector-recording   = true
*.adminRouter.ospf.**.scalar-recording = true
*.adminRouter.ospf.**.vector-recording = true

# ─────────────────────────────────────────────────────────────────────
# Config 3b: OSPF with Bursty traffic
# ─────────────────────────────────────────────────────────────────────
[Config OSPF_Bursty]
description = "Campus network with OSPF + Bursty traffic"
extends = OSPF

*.seHost*.app[0].sendInterval = 0.001s
