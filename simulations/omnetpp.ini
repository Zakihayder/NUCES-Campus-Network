# ═══════════════════════════════════════════════════════════════════════════
#  NUCES Campus Network — OMNeT++ Simulation Configuration
# ═══════════════════════════════════════════════════════════════════════════

[General]
network = simulations.CampusNetwork

sim-time-limit = 180s
record-eventlog = true

# Result Recording
**.scalar-recording = true
**.vector-recording = true

# ──────────────────────────────────────────────────────────────────────────
# Failure Scenario
# ──────────────────────────────────────────────────────────────────────────

*.scenarioManager.script = xmldoc("failure_scenario.xml")

# ──────────────────────────────────────────────────────────────────────────
# AUTOMATIC IPV4 CONFIGURATION
# (Replaces broken manual XML interface assignment)
# ──────────────────────────────────────────────────────────────────────────

*.configurator.assignAddresses = true
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = true
*.configurator.addSubnetRoutes = true

# Optional but recommended
*.configurator.dumpAddresses = true
*.configurator.dumpRoutes = true

# ──────────────────────────────────────────────────────────────────────────
# Traffic Generator Common Parameters
# ──────────────────────────────────────────────────────────────────────────

*.tgSE1.destAddr = "10.0.6.1"
*.tgSE2.destAddr = "10.0.6.1"
*.tgSE3.destAddr = "10.0.6.1"

*.tgSE1.startTime = 20s
*.tgSE2.startTime = 20s
*.tgSE3.startTime = 20s

*.tgSE1.stopTime = 155s
*.tgSE2.stopTime = 155s
*.tgSE3.stopTime = 155s


# ═══════════════════════════════════════════════════════════════════════════
# CONFIG 1 — STATIC ROUTING + CBR
# ═══════════════════════════════════════════════════════════════════════════

[Config StaticRouting_CBR]

description = "Custom Static Routing with CBR Traffic"

*.coreRouter.typename = "src.StaticRouter"
*.seRouter.typename = "src.StaticRouter"
*.eeRouter.typename = "src.StaticRouter"
*.bbaRouter.typename = "src.StaticRouter"
*.adminRouter.typename = "src.StaticRouter"

# Static Route Tables
*.coreRouter.routeTable = "10.0.1.0/24:0;10.0.2.0/24:1;10.0.3.0/24:2;10.0.4.0/24:3;10.0.5.0/24:4;10.0.6.0/24:5"

*.seRouter.routeTable = "0.0.0.0/0:0"
*.eeRouter.routeTable = "0.0.0.0/0:0"
*.bbaRouter.routeTable = "0.0.0.0/0:0"
*.adminRouter.routeTable = "0.0.0.0/0:0"

# CBR Traffic
*.tgSE1.trafficProfile = "CBR"
*.tgSE2.trafficProfile = "CBR"
*.tgSE3.trafficProfile = "CBR"

*.tgSE1.packetSize = 512B
*.tgSE2.packetSize = 512B
*.tgSE3.packetSize = 512B

*.tgSE1.sendInterval = 0.01s
*.tgSE2.sendInterval = 0.01s
*.tgSE3.sendInterval = 0.01s


# ═══════════════════════════════════════════════════════════════════════════
# CONFIG 2 — STATIC ROUTING + BURSTY
# ═══════════════════════════════════════════════════════════════════════════

[Config StaticRouting_Bursty]

description = "Custom Static Routing with Bursty Traffic"

*.coreRouter.typename = "src.StaticRouter"
*.seRouter.typename = "src.StaticRouter"
*.eeRouter.typename = "src.StaticRouter"
*.bbaRouter.typename = "src.StaticRouter"
*.adminRouter.typename = "src.StaticRouter"

*.coreRouter.routeTable = "10.0.1.0/24:0;10.0.2.0/24:1;10.0.3.0/24:2;10.0.4.0/24:3;10.0.5.0/24:4;10.0.6.0/24:5"

*.seRouter.routeTable = "0.0.0.0/0:0"
*.eeRouter.routeTable = "0.0.0.0/0:0"
*.bbaRouter.routeTable = "0.0.0.0/0:0"
*.adminRouter.routeTable = "0.0.0.0/0:0"

# Bursty Traffic
*.tgSE1.trafficProfile = "Bursty"
*.tgSE2.trafficProfile = "Bursty"
*.tgSE3.trafficProfile = "Bursty"

*.tgSE1.packetSize = 512B
*.tgSE2.packetSize = 512B
*.tgSE3.packetSize = 512B

*.tgSE1.burstSize = 10
*.tgSE2.burstSize = 10
*.tgSE3.burstSize = 10

*.tgSE1.burstGap = 0.5s
*.tgSE2.burstGap = 0.5s
*.tgSE3.burstGap = 0.5s


# ═══════════════════════════════════════════════════════════════════════════
# CONFIG 3 — RIP + CBR
# ═══════════════════════════════════════════════════════════════════════════

[Config RIP_CBR]

description = "RIP Routing with CBR Traffic"

*.coreRouter.hasRip = true
*.seRouter.hasRip = true
*.eeRouter.hasRip = true
*.bbaRouter.hasRip = true
*.adminRouter.hasRip = true

**.rip.updateInterval = 30s
**.rip.routeExpiryTime = 180s
**.rip.routePurgeTime = 120s
**.rip.splitHorizonMode = "SplitHorizon"

# CBR Traffic
*.tgSE1.trafficProfile = "CBR"
*.tgSE2.trafficProfile = "CBR"
*.tgSE3.trafficProfile = "CBR"

*.tgSE1.packetSize = 512B
*.tgSE2.packetSize = 512B
*.tgSE3.packetSize = 512B

*.tgSE1.sendInterval = 0.01s
*.tgSE2.sendInterval = 0.01s
*.tgSE3.sendInterval = 0.01s


